# Debug APK этой сборки: тот же путь, что у job `android` в ci.yml, плюс
# выгрузка файла. Нужен, чтобы поставить сборку рядом с оригиналом и
# посмотреть шапку внизу на телефоне.
name: apk

on:
  workflow_dispatch:
  # Ветка этой сборки: пуш в неё и собирает APK. `workflow_dispatch`
  # требует файла в ветке по умолчанию, а её здесь нет нарочно.
  push:
    branches: [bottom-bar]

permissions:
  contents: read

jobs:
  apk:
    name: debug APK for arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust и NDK — закреплённые, те же, что у выпуска: Rust называет
      # android/rust-toolchain.toml, NDK — `ndkVersion` в Gradle.
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "no ndkVersion in android/app/build.gradle.kts" >&2; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The app builds
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pabis=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: brevier-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
